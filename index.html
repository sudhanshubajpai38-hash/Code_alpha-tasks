<!DOCTYPE html>
<html lang="en">
<head>
  <title>Language Translator</title>
    </head>
<body>

<h2>🌍 Language Translation Tool</h2>

<textarea id="inputText" rows="5" cols="50" placeholder="Enter text"></textarea><br><br>

<label>Source Language:</label>
<select id="source">
  <option value="en">English</option>
  <option value="hi">Hindi</option>
  <option value="fr">French</option>
</select>

<label>Target Language:</label>
<select id="target">
  <option value="hi">Hindi</option>
  <option value="en">English</option>
  <option value="fr">French</option>
</select>

<br><br>
<button onclick="translateText()">Translate</button>

<h3>Translated Text:</h3>
<p id="output"></p>

<button onclick="copyText()">Copy</button>

<!-- Background Music -->
<audio id="bgMusic" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Ripple Sound -->
<audio id="clickSound">
  <source src="https://www.soundjay.com/water/sounds/water-drop-1.mp3" type="audio/mpeg">
</audio>

<script>
  function translateText() {
    let text = document.getElementById("inputText").value;
    let source = document.getElementById("source").value;
    let target = document.getElementById("target").value;

    fetch('/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, source, target })
    })
            .then(res => res.json())
            .then(data => {
              document.getElementById("output").innerText = data.translated_text;
            });
  }

  function copyText() {
    let text = document.getElementById("output").innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
  }

  });

</script>

</body>
</html>
